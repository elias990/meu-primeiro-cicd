<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#282c34">
  <title>Automação CI/CD</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #282c34;
      color: #fff;
      text-align: center;
    }
    main { max-width: 760px; }
    h1 { color: #61dafb; font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: 16px; }
    p { color: #d9e0ea; font-size: 1.15rem; line-height: 1.7; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      border: 1px solid #61dafb;
      border-radius: 999px;
      color: #61dafb;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Versão 2.0: Deploy Automatizado com Sucesso!</h1>
    <p>Configurando meu primeiro Pipeline CI/CD na aula de Engenharia de Software.</p>
    <span class="badge">Publicado com GitHub Pages</span>
  </main>
</body>
</html>
